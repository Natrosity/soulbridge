{% extends "base.html" %}
{% block title %}Sign in · {{ instance }}{% endblock %}
{% block content %}
<div class="authwrap">
  <div class="authcard">
    <div class="authlogo"><img src="/static/apple-touch-icon.png" alt="" width="56" height="56"></div>
    <h1>{{ instance }}</h1>
    {% if error %}<div class="autherr">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Username
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    {% if plex_login %}
    <div class="authdiv"><span>or</span></div>
    <a class="btn plex js-busy" href="/auth/plex/start" data-busy="Connecting to Plex…">Sign in with Plex</a>
    {% endif %}
  </div>
</div>
{% endblock %}
