<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ instance }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">◈</span> {{ instance }}
  </a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/search">Search</a>
    <a href="/settings">Settings</a>
  </nav>
  <div class="statusstrip">
    <span class="dot {{ 'on' if wstatus.running else 'off' }}" title="worker"></span>
    <span class="pill {{ 'ok' if wstatus.slskd_connected else 'err' }}">Soulseek</span>
    <span class="pill {{ 'ok' if wstatus.abr_connected else 'muted' }}">ABR</span>
    <span class="poll">{{ wstatus.last_poll or '—' }}</span>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  <span>Soulbridge v{{ version }}</span>
  <span>request audiobooks &middot; fulfil from Soulseek</span>
</footer>
</body>
</html>
