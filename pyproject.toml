[project]
name = "soulscribe"
version = "0.15.0"
description = "A self-hosted request platform for audiobooks: browse and request titles, and Soulscribe fetches, organises, and tags them from Soulseek (via slskd). Can also fulfil AudioBookRequest / *arr requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Natrosity" }]
keywords = ["audiobooks", "soulseek", "slskd", "audiobookshelf", "plex", "self-hosted"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    "apprise>=1.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Natrosity/soulscribe"
Repository = "https://github.com/Natrosity/soulscribe"

[project.scripts]
soulscribe = "soulscribe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
