[project]
name = "soulbridge"
version = "0.9.2"
description = "Request audiobooks and fulfil them from Soulseek. The audiobook bridge between AudioBookRequest / the *arr stack and slskd."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Natrosity" }]
keywords = ["audiobooks", "soulseek", "slskd", "audiobookshelf", "plex", "self-hosted"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
]

[project.urls]
Homepage = "https://github.com/Natrosity/soulbridge"
Repository = "https://github.com/Natrosity/soulbridge"

[project.scripts]
soulbridge = "soulbridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulbridge"]
