# Soulscribe: example deployment.
# Mount the SAME media parent that slskd and your library share, so completed
# Soulseek downloads can be moved into the library on one filesystem.
services:
  soulscribe:
    image: ghcr.io/natrosity/soulscribe:latest
    container_name: soulscribe
    restart: unless-stopped
    ports:
      - "8793:8793"
    environment:
      - TZ=Etc/UTC
      # Optional first-run seeds (everything is also editable in the web UI):
      - SOULSCRIBE_SLSKD_URL=http://slskd:5030
      # - SOULSCRIBE_SLSKD_API_KEY=...
      - SOULSCRIBE_SLSKD_DOWNLOADS_PATH=/data/soulseek/complete
      - SOULSCRIBE_ABR_URL=http://audiobookrequest:8000
      # - SOULSCRIBE_ABR_API_KEY=...
      - SOULSCRIBE_LIBRARY_PATH=/data/media/audiobooks
    volumes:
      - ./config:/config          # Soulscribe database + settings
      - /path/to/data:/data       # must contain both the slskd downloads and the library
    # Reach slskd / AudioBookRequest by container name — put them on a shared network.
